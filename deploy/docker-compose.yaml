services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      - FLASK_ENV=production
    volumes:
      # o código (rede.py, wsgi.py, templates, etc.) já vai embutido na imagem (veja Dockerfile).
      # bases sqlite, rede.ini e o override de ambiente rede.ini.local são montados,
      # para atualizar sem rebuild.
      # rede.ini.local precisa existir no host ANTES do primeiro `docker-compose up`
      # (ver deploy/README.md) -- montar um arquivo que não existe no host faz o
      # Docker criar um DIRETÓRIO nesse caminho dentro do container.
      - ../rede/bases:/rede-cnpj/rede/bases
      - ../rede/rede.ini:/rede-cnpj/rede/rede.ini
      - ../rede/rede.ini.local:/rede-cnpj/rede/rede.ini.local
    working_dir: /rede-cnpj/rede
    expose:
      - "8000"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      # certificado gerado com gerar_certificado_autoassinado.sh, ou fornecido
      # manualmente -- veja deploy/README.md, seção HTTPS
      - ./nginx/certs:/etc/nginx/certs:ro
      - ../rede/static:/rede-cnpj/rede/static
    depends_on:
      - app
