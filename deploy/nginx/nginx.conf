server {
    listen 80;
    server_name localhost;

    # Configuração para arquivos estáticos
    location /static/ {
        alias /rede-cnpj/rede/static/;
        expires 30d;
        access_log off;
    }

    # Configuração para a aplicação Flask
    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# HTTPS: exige um certificado em deploy/nginx/certs/fullchain.pem e privkey.pem
# (o nginx não sobe sem eles). Gere um autoassinado com
# deploy/nginx/gerar_certificado_autoassinado.sh, ou coloque um certificado real
# (ex.: Let's Encrypt/certbot) com esses mesmos nomes -- veja deploy/README.md.
server {
    listen 443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location /static/ {
        alias /rede-cnpj/rede/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
